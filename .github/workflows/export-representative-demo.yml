name: Export representative demo data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-representative-demo
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the compatible research environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Build the selected real light-curve samples
        run: python scripts/build_representative_demo_samples.py

      - name: Export browser-ready representative data
        run: python scripts/export_representative_demo.py

      - name: Commit the browser data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/representative_cases.json
          git diff --cached --quiet || git commit -m "Export representative demo data"
          git push
